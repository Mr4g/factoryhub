<!doctype html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packing Kiosk</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="logo.png" alt="Logo" />
        <div class="brand-text">
          <div class="brand-title">Factory Hub</div>
          <div class="brand-subtitle">Portal z instrukcjami</div>
        </div>
      </div>

      <nav class="top-actions">
        <a class="admin-link" href="/admin">Admin</a>
      </nav>
    </header>


    <section class="scan">
      <input id="scanInput" type="text" inputmode="numeric" autocomplete="off" autofocus
        placeholder="SCAN HERE… np. 12345678" />
      <button id="confirmBtn" class="secondary-btn">Potwierdź</button>
      <button id="scanQrBtn" class="icon-btn" type="button" aria-label="Skanuj QR" title="Skanuj QR">
        📷
      </button>

      <button id="clearBtn" class="secondary-btn">Wyczyść</button>
    </section>

    <input id="qrImageInput" type="file" accept="image/*" capture="environment" class="hidden" />

    <section id="status" class="status info">Gotowe.</section>

    <section id="result" class="panel hidden">
      <div class="meta-panel">
        <div class="meta">
          <div><b>Materiał:</b> <span id="mNo"></span></div>
          <div><b>Nazwa:</b> <span id="mTitle"></span></div>
          <div><b>Typ:</b> <span id="mType" class="badge"></span></div>
          <div><b>Plik:</b> <span id="mPath" class="small"></span></div>
        </div>
      </div>

      <div id="htmlBox" class="hidden"></div>

      <div id="pdfBox" class="hidden">
        <iframe id="pdfFrame" class="frame"></iframe>
      </div>
    </section>
  </div>
  <div id="fsOverlay" class="fs-overlay hidden">
    <div class="fs-topbar">
      <button id="fsBackBtn" class="fs-btn">Wróć</button>
      <div id="fsTitle" class="fs-title">Instrukcja</div>
    </div>

    <div id="fsContent" class="fs-content"></div>
  </div>

  <div id="qrOverlay" class="fs-overlay hidden">
    <div class="fs-topbar qr-topbar">
      <button id="qrCloseBtn" class="fs-btn">Wróć</button>
      <select id="qrCameraSelect" class="qr-camera-select"></select>
      <button id="qrPickImageBtn" class="fs-btn" type="button">Zdjęcie</button>
      <div class="fs-title">Skanuj QR</div>
    </div>

    <div class="fs-content" style="position:relative;">
      <video id="qrVideo" playsinline style="width:100%;height:100%;object-fit:cover;"></video>
      <div
        style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <div
          style="width:min(70vw,360px);height:min(70vw,360px);border:2px solid rgba(255,255,255,0.7);border-radius:16px;">
        </div>
      </div>
    </div>
  </div>



  <script src="kiosk.js"></script>
</body>

</html>
